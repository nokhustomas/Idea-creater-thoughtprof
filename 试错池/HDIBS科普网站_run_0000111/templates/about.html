<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .brand { color: #667eea; font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-link { color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 5px; transition: background 0.3s; }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .main-content { max-width: 800px; margin: 60px auto; padding: 0 20px; }
        .section { margin-bottom: 60px; }
        .section-title { font-size: 28px; color: #1a1a2e; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 3px solid #667eea; }
        .section-content { font-size: 18px; line-height: 1.8; color: #555; }
        .back-link { display: inline-block; margin-top: 40px; padding: 12px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; transition: background 0.3s; }
        .back-link:hover { background: #764ba2; }
        .footer { text-align: center; padding: 40px 20px; color: #888; font-size: 14px; }
        @media (max-width: 768px) { .nav-menu { flex-direction: column; gap: 10px; } .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">HDIBS</div>
        <ul class="nav-menu"><li><a href="/client" class="nav-link">返回首页</a></li></ul>
    </nav>
    <main class="main-content">
        <div class="section">
            <h2 class="section-title">关于HDIBS</h2>
            <p class="section-content">{{ content.about_hdibs }}</p>
        </div>
        <div class="section">
            <h2 class="section-title">历任社长</h2>
            <p class="section-content">{{ content.past_presidents }}</p>
        </div>
        <a href="/client" class="back-link">返回主页</a>
    </main>
    <footer class="footer"><p>© 2024 HDIBS 科学普及平台</p></footer>
</body>
</html>
