<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDIBS - 首页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .brand { color: #667eea; font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-item { position: relative; }
        .nav-link { color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 5px; transition: background 0.3s; cursor: pointer; }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .dropdown { position: absolute; top: 100%; left: 0; background: #fff; min-width: 150px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); display: none; z-index: 100; overflow: hidden; }
        .dropdown.show { display: block; }
        .dropdown-item { position: relative; }
        .dropdown-item a { display: block; padding: 12px 20px; color: #333; text-decoration: none; transition: background 0.2s; }
        .dropdown-item a:hover { background: #f0f0f0; }
        .sub-dropdown { position: absolute; left: 100%; top: 0; background: #fff; min-width: 140px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); display: none; }
        .dropdown-item:hover .sub-dropdown { display: block; }
        .sub-dropdown a { display: block; padding: 12px 20px; color: #333; text-decoration: none; transition: background 0.2s; }
        .sub-dropdown a:hover { background: #e8e8e8; }
        .main-content { max-width: 800px; margin: 80px auto; text-align: center; padding: 0 20px; }
        .welcome-line { font-size: 32px; color: #1a1a2e; margin-bottom: 20px; font-weight: bold; }
        .subtitle { font-size: 20px; color: #666; line-height: 1.8; }
        @media (max-width: 768px) { .nav-menu { flex-direction: column; gap: 10px; } .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">HDIBS</div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="/about" class="nav-link">关于我们</a></li>
            <li class="nav-item"><a href="/members" class="nav-link">社团成员</a></li>
            <li class="nav-item">
                <span class="nav-link" onclick="toggleDropdown(this)">路径资源</span>
                <div class="dropdown">
                    <div class="dropdown-item"><a href="#">物理学 ▸</a>
                        <div class="sub-dropdown">
                            <a href="/resources/physics/optics">光学</a>
                            <a href="/resources/physics/mechanics">力学</a>
                            <a href="/resources/physics/electricity">电学</a>
                            <a href="/resources/physics/quantum">量子力学</a>
                            <a href="/resources/physics/thermodynamics">热学</a>
                        </div>
                    </div>
                    <div class="dropdown-item"><a href="#">化学 ▸</a>
                        <div class="sub-dropdown">
                            <a href="/resources/chemistry/inorganic">无机化学</a>
                            <a href="/resources/chemistry/organic">有机化学</a>
                            <a href="/resources/chemistry/environmental">环境化学</a>
                        </div>
                    </div>
                    <div class="dropdown-item"><a href="#">生物学 ▸</a>
                        <div class="sub-dropdown">
                            <a href="/resources/biology/neurobiology">神经生物学</a>
                            <a href="/resources/biology/other">其他生物学</a>
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </nav>
    <main class="main-content">
        <p class="welcome-line">欢迎，</p>
        <p class="subtitle">希望你可以在这里燃起你对科学的兴趣。</p>
    </main>
    <script>
        function toggleDropdown(el) { var dropdown = el.nextElementSibling; dropdown.classList.toggle('show'); }
        document.addEventListener('click', function(e) { if (!e.target.matches('.nav-link')) { document.querySelectorAll('.dropdown').forEach(function(d) { d.classList.remove('show'); }); } });
    </script>
</body>
</html>
