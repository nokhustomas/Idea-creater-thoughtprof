<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制端 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .navbar { background: rgba(0,0,0,0.3); padding: 15px 30px; }
        .brand { color: #667eea; font-size: 24px; font-weight: bold; }
        .main-content { max-width: 800px; margin: 100px auto; text-align: center; padding: 0 20px; }
        .welcome-text { font-size: 32px; margin-bottom: 40px; }
        .btn { display: inline-block; padding: 15px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-decoration: none; border-radius: 8px; font-size: 18px; transition: transform 0.3s, box-shadow 0.3s; }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
        .logout { position: absolute; top: 15px; right: 30px; color: #fff; text-decoration: none; opacity: 0.8; }
        .logout:hover { opacity: 1; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">HDIBS 控制端</div>
        <a href="/logout" class="logout">退出登录</a>
    </nav>
    <main class="main-content">
        <p class="welcome-text">欢迎，感谢你对HDIBS作出的贡献。</p>
        <a href="/edit" class="btn">进入修改</a>
    </main>
</body>
</html>
