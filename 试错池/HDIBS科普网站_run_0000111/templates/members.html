<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团成员 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #1a1a2e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .brand { color: #667eea; font-size: 24px; font-weight: bold; }
        .nav-menu { display: flex; gap: 30px; list-style: none; }
        .nav-link { color: #fff; text-decoration: none; padding: 10px 15px; border-radius: 5px; }
        .main-content { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 40px; text-align: center; }
        .members-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .member-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; transition: transform 0.3s; }
        .member-card:hover { transform: translateY(-5px); }
        .photo-frame { width: 120px; height: 120px; margin: 0 auto 20px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; }
        .photo-placeholder { color: white; font-size: 40px; }
        .member-name { font-size: 20px; font-weight: bold; color: #1a1a2e; margin-bottom: 10px; }
        .member-info { font-size: 14px; color: #666; line-height: 1.6; }
        .back-link { display: inline-block; margin: 40px auto 0; padding: 12px 24px; background: #667eea; color: white; text-decoration: none; border-radius: 8px; display: block; width: fit-content; }
        .back-link:hover { background: #764ba2; }
        @media (max-width: 768px) { .nav-menu { flex-direction: column; gap: 10px; } .navbar { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="brand">HDIBS</div>
        <ul class="nav-menu"><li><a href="/client" class="nav-link">返回首页</a></li></ul>
    </nav>
    <main class="main-content">
        <h1>社团成员</h1>
        <div class="members-grid">
            {% for member in content.members %}
            <div class="member-card">
                <div class="photo-frame"><span class="photo-placeholder">👤</span></div>
                <h3 class="member-name">{{ member.name }}</h3>
                <p class="member-info">{{ member.info }}</p>
            </div>
            {% endfor %}
        </div>
        <a href="/client" class="back-link">返回主页</a>
    </main>
</body>
</html>
