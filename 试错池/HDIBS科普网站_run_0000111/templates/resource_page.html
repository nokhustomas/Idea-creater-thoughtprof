<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category }} - {{ subcategory }} - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .navbar { background: #1a1a2e; padding: 15px 30px; }
        .brand { color: #667eea; font-size: 24px; font-weight: bold; }
        .main-content { max-width: 800px; margin: 100px auto; text-align: center; padding: 0 20px; }
        h1 { font-size: 36px; color: #1a1a2e; margin-bottom: 20px; }
        .subtitle { font-size: 20px; color: #666; margin-bottom: 40px; }
        .placeholder { background: white; padding: 60px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .placeholder-text { color: #999; font-size: 18px; }
    </style>
</head>
<body>
    <nav class="navbar"><div class="brand">HDIBS</div></nav>
    <main class="main-content">
        <div class="placeholder">
            <h1>{{ category }} - {{ subcategory }}</h1>
            <p class="subtitle">内容正在整理中...</p>
            <p class="placeholder-text">空白页面 - 等待内容填充</p>
        </div>
    </main>
</body>
</html>
