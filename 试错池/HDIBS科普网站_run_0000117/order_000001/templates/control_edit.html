<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容修改 - HDIBS 控制端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        nav {
            background: #1a1a2e;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-section {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-section h2 {
            color: #1a1a2e;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1a1a2e;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            min-height: 100px;
            resize: vertical;
        }
        .form-group textarea:focus {
            outline: none;
            border-color: #1a1a2e;
        }
        button[type="submit"] {
            padding: 12px 30px;
            background: #1a1a2e;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button[type="submit"]:hover { background: #16213e; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #1a1a2e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }
        .logout {
            position: absolute;
            right: 30px;
            top: 15px;
        }
        .logout a {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="brand">HDIBS 控制端</a>
        <a href="/logout" class="logout">退出</a>
        <ul>
            <li><a href="/control/edit">进入修改</a></li>
        </ul>
    </nav>
    
    <div class="container">
        {% if success %}
        <div class="success-msg">保存成功！</div>
        {% endif %}
        
        <form method="POST" action="/control/update">
            <div class="form-section">
                <h2>关于我们</h2>
                <div class="form-group">
                    <label for="about_hdibs">关于HDIBS</label>
                    <textarea name="about_hdibs" id="about_hdibs">{{ content.about_hdibs }}</textarea>
                </div>
                <div class="form-group">
                    <label for="previous_leaders">历任社长</label>
                    <textarea name="previous_leaders" id="previous_leaders">{{ content.previous_leaders }}</textarea>
                </div>
            </div>
            
            <div class="form-section">
                <h2>社团成员</h2>
                {% for i in range(10) %}
                <div class="form-group">
                    <label for="member_{{ i }}">成员 {{ i + 1 }}</label>
                    <textarea name="member_{{ i }}" id="member_{{ i }}">{{ content.members[i] }}</textarea>
                </div>
                {% endfor %}
            </div>
            
            <button type="submit">保存修改</button>
        </form>
        
        <a href="/control/home" class="back-link">← 返回控制端首页</a>
    </div>
</body>
</html>
