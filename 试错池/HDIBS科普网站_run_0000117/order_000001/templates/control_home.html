<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制端 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        nav {
            background: #1a1a2e;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        nav ul li a:hover { background: rgba(255,255,255,0.1); }
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        .hero {
            background: #fff;
            padding: 80px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hero h1 {
            font-size: 36px;
            color: #1a1a2e;
            margin-bottom: 30px;
        }
        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        .btn-main {
            display: inline-block;
            padding: 15px 40px;
            background: #1a1a2e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            transition: background 0.3s;
        }
        .btn-main:hover { background: #16213e; }
        .logout {
            position: absolute;
            right: 30px;
            top: 15px;
        }
        .logout a {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="#" class="brand">HDIBS 控制端</a>
        <a href="/logout" class="logout">退出</a>
        <ul>
            <li><a href="/control/edit">进入修改</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <div class="hero">
            <h1>欢迎，感谢你对HDIBS作出的贡献。</h1>
            <p>在这里你可以修改客户端的展示内容</p>
            <a href="/control/edit" class="btn-main">进入修改</a>
        </div>
    </div>
</body>
</html>
