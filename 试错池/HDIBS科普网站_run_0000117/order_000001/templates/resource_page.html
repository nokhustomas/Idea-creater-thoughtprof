<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subcategory_name }} - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        nav {
            background: #1a1a2e;
            padding: 15px 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        .content-section {
            background: #fff;
            padding: 60px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .content-section h1 {
            color: #1a1a2e;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .content-section p {
            color: #666;
            font-size: 18px;
            line-height: 1.8;
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: #1a1a2e;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
        }
        .back-link:hover { background: #16213e; }
        .logout {
            position: absolute;
            right: 30px;
            top: 15px;
        }
        .logout a {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/client/home" class="brand">HDIBS</a>
        <a href="/logout" class="logout">退出</a>
    </nav>
    
    <div class="container">
        <div class="content-section">
            <h1>{{ subcategory_name }}</h1>
            <p>这是 {{ category_name }} - {{ subcategory_name }} 的学习内容页面。</p>
            <p>本页面正在建设中，敬请期待...</p>
            <a href="/client/home" class="back-link">← 返回主页</a>
        </div>
    </div>
</body>
</html>
