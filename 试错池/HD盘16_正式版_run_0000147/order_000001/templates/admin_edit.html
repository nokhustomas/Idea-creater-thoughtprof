<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改内容 - HDIBS 控制端</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#222}
  nav{background:#1f2a44;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700}
  .menu a{display:inline-block;padding:8px 14px;color:#fff;text-decoration:none;border-radius:6px;font-size:15px}
  main{padding:24px 16px;max-width:820px;margin:0 auto}
  .card{background:#fff;border-radius:10px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:18px}
  h2{font-size:18px;color:#1f2a44;margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid #eef2f8}
  label{display:block;font-size:14px;color:#444;margin:8px 0 4px}
  textarea,input[type=text]{width:100%;padding:8px 10px;border:1px solid #ccd2dc;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
  textarea:focus,input[type=text]:focus{border-color:#1f2a44}
  textarea{min-height:90px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.row{grid-template-columns:1fr}}
  .save{margin-top:8px;padding:12px 20px;background:#1f2a44;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer}
  .save:hover{background:#2c3a5a}
  .ok{background:#eaf7ec;color:#1e7e34;padding:10px 12px;border-radius:6px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<nav>
  <div class="brand">HDIBS 控制端</div>
  <div class="menu"><a href="/admin">返回首页</a></div>
</nav>
<main>
  {% if saved %}<div class="ok">已保存！客户端已可看到最新内容。</div>{% endif %}
  <form method="POST" action="/admin/edit">
    <section class="card">
      <h2>关于我们页内容</h2>
      <label for="about_hdibs">关于HDIBS 正文</label>
      <textarea id="about_hdibs" name="about_hdibs">{{ data.about_hdibs }}</textarea>
      <label for="history">历任社长</label>
      <textarea id="history" name="history">{{ data.history }}</textarea>
    </section>

    <section class="card">
      <h2>社团成员（10 栏）</h2>
      {% for i in range(1,11) %}
      {% set m = data.members[i-1] if (i-1) < data.members|length else {'name':'','desc':''} %}
      <div class="row">
        <div>
          <label>第 {{ i }} 栏 姓名</label>
          <input type="text" name="member_{{ i }}_name" value="{{ m.name }}">
        </div>
        <div>
          <label>第 {{ i }} 栏 介绍</label>
          <input type="text" name="member_{{ i }}_desc" value="{{ m.desc }}">
        </div>
      </div>
      {% endfor %}
    </section>

    <button class="save" type="submit">保存全部修改</button>
  </form>
</main>
</body>
</html>
