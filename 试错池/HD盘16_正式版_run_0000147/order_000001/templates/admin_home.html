<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制端 - HDIBS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#222}
  nav{background:#1f2a44;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700}
  .menu a{display:inline-block;padding:8px 14px;color:#fff;text-decoration:none;border-radius:6px;font-size:15px}
  .menu a:hover{background:#2c3a5a}
  main{padding:24px 16px;max-width:680px;margin:0 auto}
  .hero{background:#fff;border-radius:10px;padding:32px 24px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .hero p{font-size:18px;color:#1f2a44;line-height:1.8;margin-bottom:24px}
  .btn{display:inline-block;padding:10px 24px;background:#1f2a44;color:#fff;text-decoration:none;border-radius:6px;font-size:15px;font-weight:600}
  .btn:hover{background:#2c3a5a}
</style>
</head>
<body>
<nav>
  <div class="brand">HDIBS 控制端</div>
  <div class="menu">
    <a href="/admin/edit">进入修改</a>
  </div>
</nav>
<main>
  <section class="hero">
    <p>欢迎，感谢你对HDIBS作出的贡献。</p>
    <a class="btn" href="/admin/edit">进入修改</a>
  </section>
</main>
</body>
</html>
