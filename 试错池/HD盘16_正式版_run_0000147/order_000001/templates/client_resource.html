<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ sub }} - HDIBS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6f9;color:#222}
  nav{background:#1f2a44;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700}
  .nav-links a{display:inline-block;padding:8px 14px;color:#fff;text-decoration:none;border-radius:6px;font-size:15px}
  .nav-links a:hover{background:#2c3a5a}
  main{padding:24px 16px;max-width:720px;margin:0 auto}
  .placeholder{background:#fff;border-radius:10px;padding:60px 20px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.05);color:#8a96aa;font-size:14px}
  .crumb{font-size:13px;color:#666;margin-bottom:10px}
  .back{display:inline-block;margin-top:20px;padding:8px 16px;background:#1f2a44;color:#fff;text-decoration:none;border-radius:6px;font-size:14px}
  .back:hover{background:#2c3a5a}
</style>
</head>
<body>
<nav>
  <div class="brand">HDIBS</div>
  <div class="nav-links">
    <a href="/client">首页</a>
  </div>
</nav>
<main>
  <div class="crumb">路径资源 / {{ cat }} / {{ sub }}</div>
  <div class="placeholder">内容正在筹备中……</div>
  <a class="back" href="/client">返回主页</a>
</main>
</body>
</html>
