<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}HDIBS{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background:#f5f7fb; color:#222; }
  a { color:#3a6df0; text-decoration:none; }
  a:hover { text-decoration:underline; }
  .navbar { background:#1f2a44; color:#fff; padding:12px 18px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .navbar .brand { font-weight:700; letter-spacing:1px; }
  .navbar a { color:#fff; padding:6px 10px; border-radius:6px; font-size:14px; }
  .navbar a:hover { background:rgba(255,255,255,.1); text-decoration:none; }
  .navbar .spacer { flex:1; }
  .navbar .small { font-size:12px; color:#aab; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  .back { display:inline-block; margin-top:24px; padding:8px 14px; border-radius:8px; background:#3a6df0; color:#fff; }
  .back:hover { background:#2f5dd6; text-decoration:none; }
  h1 { font-size:22px; margin-top:0; }
  h2 { font-size:18px; margin-top:28px; }
  .muted { color:#888; font-size:13px; }
</style>
</head>
<body>
  <nav class="navbar">
    <span class="brand">HDIBS</span>
    {% block nav %}{% endblock %}
    <span class="spacer"></span>
    <a class="small" href="/logout">退出登录</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
