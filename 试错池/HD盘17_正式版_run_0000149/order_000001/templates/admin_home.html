{% extends "_base.html" %}
{% block title %}HDIBS · 控制端{% endblock %}
{% block nav %}
  <a href="/admin/edit" style="background:rgba(255,255,255,.12);">进入修改</a>
{% endblock %}
{% block content %}
<style>
  .welcome { background:#fff; padding:28px 20px; border-radius:12px;
             box-shadow:0 4px 14px rgba(0,0,0,.05); text-align:center; margin-top:18px; }
  .welcome h1 { margin:0 0 6px; font-size:22px; }
  .welcome p { color:#666; margin:0; font-size:14px; }
  .actions { margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-block; padding:10px 18px; background:#3a6df0; color:#fff;
         border-radius:8px; font-size:14px; }
  .btn:hover { background:#2f5dd6; text-decoration:none; }
</style>

<section class="welcome">
  <h1>欢迎，感谢你对HDIBS作出的贡献。</h1>
  <p>控制端首页 · 点击下方按钮进入内容编辑页面</p>
  <div class="actions">
    <a class="btn" href="/admin/edit">进入修改</a>
  </div>
</section>
{% endblock %}
