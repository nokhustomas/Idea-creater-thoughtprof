{% extends "_base.html" %}
{% block title %}HDIBS · 社团成员{% endblock %}
{% block nav %}
  <a href="/client">首页</a>
  <a href="/client/about">关于我们</a>
  <a href="/client/members">社团成员</a>
  <a href="/client/resources">路径资源</a>
{% endblock %}
{% block content %}
<h1>社团成员</h1>
<p class="muted">这里展示了社团成员的介绍。</p>

<style>
  .members-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:12px; }
  .member { background:#fff; border-radius:12px; box-shadow:0 4px 14px rgba(0,0,0,.05); padding:14px; }
  .photo { width:100%; height:160px; border:1px dashed #c8ccd6; border-radius:8px;
           display:flex; align-items:center; justify-content:center; color:#aab; background:#fafbff;
           margin-bottom:10px; overflow:hidden; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .mtext { font-size:14px; line-height:1.6; color:#333; min-height:48px; white-space:pre-wrap; word-break:break-word; }
</style>

<div id="members" class="members-grid">
  {% for m in members %}
  <div class="member">
    <div class="photo">
      {% if m.photo %}<img src="{{ m.photo }}" alt="成员照片">{% else %}照片{% endif %}
    </div>
    <div class="mtext">{{ m.text }}</div>
  </div>
  {% endfor %}
</div>

<a class="back" href="/client">返回主页</a>
{% endblock %}
