<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑内容 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        nav {
            background: #1a1a2e;
            padding: 15px 20px;
        }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            display: inline-block;
            background: #4a90d9;
            border-radius: 5px;
        }
        .main-content {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #1a1a2e; font-size: 24px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; color: #1a1a2e; font-weight: bold; margin-bottom: 5px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        textarea { height: 100px; resize: vertical; }
        button {
            padding: 12px 30px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #16213e; }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1a1a2e;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/admin" class="nav-link">返回控制端首页</a>
        <a href="/logout" class="nav-link" style="background:#d9534f; margin-left:10px;">退出登录</a>
    </nav>
    <div class="main-content">
        <h1>编辑客户端内容</h1>
        {% if success %}
        <div class="success">保存成功！</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="about_hdibs">关于HDIBS</label>
                <textarea id="about_hdibs" name="about_hdibs">{{ content.about_hdibs }}</textarea>
            </div>
            <div class="form-group">
                <label for="about_history">历任社长</label>
                <textarea id="about_history" name="about_history">{{ content.about_history }}</textarea>
            </div>
            <h2 style="margin:30px 0 15px; font-size:18px;">社团成员第1栏</h2>
            <div class="form-group">
                <label for="member1_name">成员1姓名</label>
                <input type="text" id="member1_name" name="member1_name" value="{{ content.members[0].name }}">
            </div>
            <div class="form-group">
                <label for="member1_desc">成员1简介</label>
                <textarea id="member1_desc" name="member1_desc">{{ content.members[0].desc }}</textarea>
            </div>
            <button type="submit">保存修改</button>
        </form>
        <a href="/client" class="back-link">预览客户端</a>
    </div>
</body>
</html>
