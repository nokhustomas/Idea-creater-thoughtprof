<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HDIBS - 科学教育</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        nav {
            background: #1a1a2e;
            padding: 15px 20px;
            position: relative;
        }
        .nav-title { color: #HDIBS; font-size: 24px; font-weight: bold; color: #fff; }
        .nav-container { display: flex; gap: 30px; align-items: center; }
        .nav-item { position: relative; }
        .nav-link {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
            cursor: pointer;
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); }
        .dropdown {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #1a1a2e;
            min-width: 150px;
            z-index: 1000;
        }
        .nav-item:hover .dropdown { display: block; }
        .dropdown-item { position: relative; }
        .dropdown-link {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .dropdown-link:hover { background: rgba(255,255,255,0.1); }
        .subdropdown {
            display: none;
            position: absolute;
            left: 100%;
            top: 0;
            background: #1a1a2e;
            min-width: 120px;
        }
        .dropdown-item:hover .subdropdown { display: block; }
        .subdropdown a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        .subdropdown a:hover { background: rgba(255,255,255,0.1); }
        .main-content {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .welcome { font-size: 32px; color: #1a1a2e; margin-bottom: 20px; }
        .subtitle { font-size: 18px; color: #666; line-height: 1.8; }
        .categories {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 50px;
            flex-wrap: wrap;
        }
        .category {
            background: #f5f5f5;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            min-width: 200px;
        }
        .category h3 { color: #1a1a2e; margin-bottom: 10px; }
        .category a { color: #1a1a2e; text-decoration: none; }
        .category a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            .categories { flex-direction: column; align-items: center; }
            .nav-container { flex-wrap: wrap; gap: 10px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="nav-title">HDIBS</div>
            <div class="nav-item">
                <span class="nav-link">关于我们</span>
                <div class="dropdown">
                    <a href="/about">关于我们</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-link">社团成员</span>
                <div class="dropdown">
                    <a href="/members">社团成员</a>
                </div>
            </div>
            <div class="nav-item">
                <span class="nav-link">路径资源</span>
                <div class="dropdown">
                    <div class="dropdown-item">
                        <span class="dropdown-link">物理学</span>
                        <div class="subdropdown">
                            <a href="/resource/光学">光学</a>
                            <a href="/resource/力学">力学</a>
                            <a href="/resource/电学">电学</a>
                            <a href="/resource/量子力学">量子力学</a>
                            <a href="/resource/热学">热学</a>
                        </div>
                    </div>
                    <div class="dropdown-item">
                        <span class="dropdown-link">化学</span>
                        <div class="subdropdown">
                            <a href="/resource/无机化学">无机化学</a>
                            <a href="/resource/有机化学">有机化学</a>
                            <a href="/resource/环境化学">环境化学</a>
                        </div>
                    </div>
                    <div class="dropdown-item">
                        <span class="dropdown-link">生物学</span>
                        <div class="subdropdown">
                            <a href="/resource/神经生物学">神经生物学</a>
                            <a href="/resource/其他生物学">其他生物学</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <div class="main-content">
        <div class="welcome">欢迎，</div>
        <div class="subtitle">希望你可以在这里燃起你对科学的兴趣。</div>
        <div class="categories">
            <div class="category">
                <h3>关于我们</h3>
                <a href="/about">了解更多 →</a>
            </div>
            <div class="category">
                <h3>社团成员</h3>
                <a href="/members">查看成员 →</a>
            </div>
            <div class="category">
                <h3>路径资源</h3>
                <p>物理学/化学/生物学</p>
            </div>
        </div>
    </div>
</body>
</html>
