<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社团成员 - HDIBS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        nav {
            background: #1a1a2e;
            padding: 15px 20px;
        }
        .nav-title { color: #fff; font-size: 24px; font-weight: bold; }
        .main-content {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }
        h2 { color: #1a1a2e; font-size: 28px; margin-bottom: 30px; text-align: center; }
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }
        .member-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .photo-frame {
            width: 100px;
            height: 100px;
            background: #ddd;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }
        .member-name { color: #1a1a2e; font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .member-desc { color: #666; font-size: 14px; line-height: 1.5; }
        .back-link {
            display: inline-block;
            margin-top: 40px;
            color: #1a1a2e;
            text-decoration: none;
            padding: 10px 20px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .back-link:hover { background: #e0e0e0; }
    </style>
</head>
<body>
    <nav>
        <div class="nav-title">HDIBS</div>
    </nav>
    <div class="main-content">
        <h2>社团成员</h2>
        <div class="members-grid">
            {% for member in content.members %}
            <div class="member-card">
                <div class="photo-frame">照片</div>
                <div class="member-name">{{ member.name }}</div>
                <div class="member-desc">{{ member.desc }}</div>
            </div>
            {% endfor %}
        </div>
        <a href="/client" class="back-link">返回主页</a>
    </div>
</body>
</html>
